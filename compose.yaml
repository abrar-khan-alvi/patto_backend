name: patto

x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.local}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-local-development-key}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
  DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
  POSTGRES_DB: ${POSTGRES_DB:-patto}
  POSTGRES_USER: ${POSTGRES_USER:-patto}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patto}
  POSTGRES_HOST: ${POSTGRES_HOST:-db}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
  OPENAI_STORE_RESPONSES: ${OPENAI_STORE_RESPONSES:-false}
  OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-45}
  OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-2}
  AI_TOPIC_ANALYSIS_PROMPT_KEY: ${AI_TOPIC_ANALYSIS_PROMPT_KEY:-topic_analysis}
  AI_FOLLOW_UP_PROMPT_KEY: ${AI_FOLLOW_UP_PROMPT_KEY:-follow_up_question}
  AI_AUTO_DISPATCH_ANALYSIS: ${AI_AUTO_DISPATCH_ANALYSIS:-false}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-smtp.example.com}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@patto.app}
  IAP_APPLE_SHARED_SECRET: ${IAP_APPLE_SHARED_SECRET:-}
  IAP_GOOGLE_SERVICE_ACCOUNT_JSON: ${IAP_GOOGLE_SERVICE_ACCOUNT_JSON:-}
  PARTNER_INVITATION_TTL_DAYS: ${PARTNER_INVITATION_TTL_DAYS:-7}
  PARTNER_INVITATION_URL_TEMPLATE: ${PARTNER_INVITATION_URL_TEMPLATE:-https://app.patto.app/invitations/accept?token={token}}
  PACT_PDF_TOKEN_TTL_MINUTES: ${PACT_PDF_TOKEN_TTL_MINUTES:-60}
  PACT_PDF_DOWNLOAD_URL_TEMPLATE: ${PACT_PDF_DOWNLOAD_URL_TEMPLATE:-https://app.patto.app/pact-pdfs/{token}/download}

services:
  api:
    image: patto-backend:local
    build: .
    command: /app/docker/start-api.sh
    environment:
      <<: *app-environment
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python manage.py healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  migrate:
    image: patto-backend:local
    build: .
    command: /app/docker/start-migrate.sh
    profiles: ["ops"]
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: patto-backend:local
    build: .
    command: /app/docker/start-worker.sh
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    image: patto-backend:local
    build: .
    command: /app/docker/start-beat.sh
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patto}
      POSTGRES_USER: ${POSTGRES_USER:-patto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patto}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-patto} -d ${POSTGRES_DB:-patto}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
